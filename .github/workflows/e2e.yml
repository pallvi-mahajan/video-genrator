name: Story reel end-to-end test

on:
  push:
    branches: [main]
    paths: ["index.html", "style.css", "js/**", "tests/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:
    inputs:
      idea:
        description: "Story idea to test (empty = built-in example script)"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e.mjs
        env:
          IDEA: ${{ github.event.inputs.idea }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output/
          retention-days: 7
